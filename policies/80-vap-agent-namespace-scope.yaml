# Built-in ValidatingAdmissionPolicy (CEL, no webhook) -- the article's third
# engine, used here as a backstop that Kyverno cannot provide:
# Kyverno's webhook deliberately skips kube-system and kyverno (see the chart's
# "security vs operability" note), and RBAC cannot restrict `patch namespaces`
# by name. Without this, a careless merge lets the GitOps identity relabel or
# take over kube-system. The API server evaluates this for every namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-namespace-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE", "UPDATE", "DELETE"]
  # Only requests from agent identities (incl. GitOps engines impersonating
  # agents/gitops-applier) are evaluated.
  matchConditions:
    - name: agent-identity
      expression: "request.userInfo.groups.exists(g, g == 'system:serviceaccounts:agents')"
  variables:
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
    - expression: >-
        variables.target.metadata.name.matches('^team-[a-z0-9]{2,12}-(dev|staging|preview|sandbox)-[a-z0-9]{4,8}$')
      messageExpression: >-
        'agents may only ' + request.operation.lowerAscii() + ' namespaces named team-<team>-<env>-<id>; '
        + variables.target.metadata.name + ' is off limits'
      reason: Forbidden
    - expression: >-
        request.operation == 'CREATE' ||
        (has(oldObject.metadata.labels) && 'provisioned-via' in oldObject.metadata.labels)
      messageExpression: >-
        'agents may only modify namespaces an agent provisioned; ' + oldObject.metadata.name
        + ' has no provisioned-via label'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-namespace-scope
spec:
  policyName: agent-namespace-scope
  validationActions: ["Deny"]
