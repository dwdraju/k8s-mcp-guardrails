# Flux pulls the reviewed tenants repo and applies it AS agents/gitops-applier,
# so merged changes still go through RBAC and every admission policy.
# (Credentials secret `tenants-repo-auth` is created by scripts/flux-setup.sh.)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tenants
  namespace: agents
spec:
  interval: 30s
  url: http://gitea:3000/platform/tenants.git
  ref:
    branch: main
  secretRef:
    name: tenants-repo-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: agents
spec:
  interval: 1m
  retryInterval: 15s
  sourceRef:
    kind: GitRepository
    name: tenants
  path: ./tenants
  prune: true          # deleting a file in git deletes the namespace
  wait: false
  timeout: 2m
  # Impersonate the restricted write identity; never Flux's cluster-admin SA.
  serviceAccountName: gitops-applier
