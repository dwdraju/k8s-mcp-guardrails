# Rendered by scripts/up.sh (__POC_DIR__ is replaced with the repo path).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mcp-guardrails
nodes:
  - role: control-plane
    extraMounts:
      # The sandbox VM has no /dev/kmsg, which kubelet needs at startup.
      # Bind /dev/null in its place (only used by kubelet's OOM watcher).
      - hostPath: /dev/null
        containerPath: /dev/kmsg
      - hostPath: __POC_DIR__/kind/audit-policy.yaml
        containerPath: /etc/kubernetes/audit/policy.yaml
        readOnly: true
      - hostPath: __POC_DIR__/audit
        containerPath: /var/log/kubernetes/audit
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-policy-file: /etc/kubernetes/audit/policy.yaml
            audit-log-path: /var/log/kubernetes/audit/audit.log
            audit-log-maxsize: "100"
            audit-log-maxbackup: "2"
          extraVolumes:
            - name: audit-policy
              hostPath: /etc/kubernetes/audit/policy.yaml
              mountPath: /etc/kubernetes/audit/policy.yaml
              readOnly: true
              pathType: File
            - name: audit-logs
              hostPath: /var/log/kubernetes/audit
              mountPath: /var/log/kubernetes/audit
              readOnly: false
              pathType: DirectoryOrCreate
